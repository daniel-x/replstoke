name: release

# Build the six target binaries and attach them to the GitHub Release when a
# version tag (v*) is pushed. A manual run (workflow_dispatch) builds the same
# matrix and uploads the archives as workflow artifacts without publishing a
# release, so the build can be exercised without cutting a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
          - { target: aarch64-pc-windows-msvc,   os: windows-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: aarch64-apple-darwin,      os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The x86-64 Linux runner needs a cross linker to emit aarch64 binaries.
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="replstoke-${GITHUB_REF_NAME}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "$staging"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/replstoke.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/replstoke" "$staging/"
          fi
          cp README.md LICENSE "$staging/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "$name" >/dev/null
            asset="${name}.zip"
          else
            tar czf "${name}.tar.gz" "$name"
            asset="${name}.tar.gz"
          fi
          # SHA-256 sidecar (sha256sum on Linux/Windows-bash, shasum on macOS).
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=dist/${asset}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${asset}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}

      # Only publish to a Release for tag pushes; manual runs stop at artifacts.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
