[package]
name = "replstoke"
version = "0.2.0"
edition = "2021"
description = "Wrap a long-running REPL and make it accessible as a one-shot (batch) tool."
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "replstoke"
path = "src/lib.rs"

[[bin]]
name = "replstoke"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
